<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscaminas</title>
  <script defer src="script.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-top: 1rem; }
    .cell { width: 24px; height: 24px; padding: 0; border: 1px solid #888; background: center / contain no-repeat url("btn.png"); cursor: pointer; }
    #result { font-weight: bold; min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Buscaminas</h1>
  <p>Haz clic para descubrir una casilla y clic derecho para colocar una bandera. La primera casilla es segura.</p>
  <table aria-label="Tablero de buscaminas"></table>
  <p id="result" role="status"></p>
</body>
</html>
